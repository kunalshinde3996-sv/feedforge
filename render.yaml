# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: feedforge
    runtime: docker
    plan: free
    region: singapore # closest Render region to Qoneqt's audience in India
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: LLM_FALLBACK_MODEL # optional: used once per call on 429/503 from the primary
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false # entered in the Render dashboard, never committed
      - key: RATE_LIMIT_MAX
        value: "10"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
